[pytest]
# Placed here rather than in the add-on root on purpose. The add-on directory is itself a
# Python package whose __init__.py imports aqt, and pytest imports the __init__.py of every
# package directory in the collection tree (Package.setup) - which fails outside Anki. Keeping
# the ini file here makes this directory the rootdir, so collection starts below the add-on
# package and never imports it. Run the suite as `pytest tests` from the add-on root.
addopts = --import-mode=importlib
